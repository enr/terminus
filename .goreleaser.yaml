# https://goreleaser.com
version: 2

builds:
  - id: terminus
    main: ./cmd/terminus
    binary: terminus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/enr/terminus/internal/buildinfo.Version={{ .Version }}
      - -X github.com/enr/terminus/internal/buildinfo.BuildTime={{ .Date }}
      - -X github.com/enr/terminus/internal/buildinfo.GitCommit={{ .FullCommit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
